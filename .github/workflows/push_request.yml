name: Pull Request Valid

on:
  # Runs on pushes targeting the default branch
  pull_request:
    branches: ['master']

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Hugo Check
  Actions-Hugo-Check:
    environment: pr-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true
      - name: Setup Dart Sass
        run: |
          curl -fsSL https://github.com/sass/dart-sass/releases/download/1.103.1/dart-sass-1.103.1-linux-x64.tar.gz \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"
      - name: Clean last public
        run: rm -rf public
      - name: Build with Hugo
        run: hugo --logLevel=warn --gc --minify
