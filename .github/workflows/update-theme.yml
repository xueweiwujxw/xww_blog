name: Update theme

# Controls when the workflow will run
on:
  schedule:
    # Update theme automatically everyday at 00:00 UTC
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  Update-FixIt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update theme
        run: git submodule update --remote --recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Setup Dart Sass
        run: |
          curl -fsSL https://github.com/sass/dart-sass/releases/download/1.103.1/dart-sass-1.103.1-linux-x64.tar.gz \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/dart-sass" >> "${GITHUB_PATH}"

      - name: Validate server build before committing
        run: hugo --logLevel=warn --gc --minify --destination "${RUNNER_TEMP}/hugo-server"

      - name: Validate Pages build before committing
        env:
          GITHUB_PAGES: 'true'
        run: hugo --logLevel=warn --gc --minify --baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" --destination "${RUNNER_TEMP}/hugo-pages"

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Chore: :arrow_up:(theme) update FixIt version'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
