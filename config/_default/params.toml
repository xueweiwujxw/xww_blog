  ]
  menu_mobile = [
    "inject/translate-menu-mobile.html",
  ]
  post_footer_before = []
  post_footer_after = []

[auto_translate]
  enable = true
  service = "client.edge"
  languages = ["chinese_traditional", "english", "japanese", "french", "russian", "spanish", "deutsch"]
  ignore_i_d = []
  ignore_class = []
  ignore_tag = []
detect_local_language = false

[link]
external_icon = false
  [toc]
    # whether to enable the table of the contents
    enable = true
    # whether to keep the static table of the contents in front of the post
    # whether to make the table of the contents in the sidebar automatically collapsed
    auto = true
    # FixIt 0.2.13 | NEW position of TOC ["left", "right"]
    position = "right"
  # FixIt 0.2.13 | NEW Display a message at the beginning of an article to warn the reader that its content might be expired
  keep_static = false
  [heading]
    # FixIt 0.3.3 | NEW whether to capitalize automatic text of headings
    capitalize = false
    # used with `markup.tableOfContents.ordered` parameter
    [heading.number]
      # whether to enable auto heading numbering
      enable = false
      # FixIt 0.3.3 | NEW only enable in main section pages (default is posts)
    only_main_section = true

      [heading.number.format]
        h1 = "{title}"
        h2 = "{h2} {title}"
        h3 = "{h2}.{h3} {title}"
        h4 = "{h2}.{h3}.{h4} {title}"
        h5 = "{h2}.{h3}.{h4}.{h5} {title}"
        h6 = "{h2}.{h3}.{h4}.{h5}.{h6} {title}"
  # FixIt 0.2.16 | CHANGED KaTeX mathematical formulas (https://katex.org)
  [math]
    enable = true
    type = "katex"
    [math.katex]
      copy_tex = true
  [mapbox]
    # access token of Mapbox GL JS
    # style for the light theme
    # style for the dark theme
    # whether to add NavigationControl
    navigation = true
    # whether to add GeolocateControl
    geolocate = true
    # whether to add ScaleControl
    scale = true
    # whether to add FullscreenControl
    fullscreen = true
  # FixIt 0.3.0 | NEW [Experimental] cache remote images locally, see: https://github.com/hugo-fixit/FixIt/pull/362
      access_token = ""
      light_style = "mapbox://styles/mapbox/light-v9"
      dark_style = "mapbox://styles/mapbox/dark-v9"
  [related]
    enable = false
    count = 5
  # FixIt 0.2.17 | NEW Donate (Sponsor) settings
  [reward]
    enable = true
    animation = true
    # position relative to post footer, optional values: ["before", "after"]
    position = "after"
    comment = "文章有帮到您的话，请我喝杯奶茶吧ヾ(●´∀｀●)"
    # FixIt 0.2.18 | NEW display mode of QR code images, optional values: ["static", "fixed"], default: `static`
    mode = "static"
    [reward.ways]
      wechatpay = "/images/wechat.png"
      alipay = "/images/alipay.png"
      # paypal = "/images/paypal.png"
      # bitcoin = "/images/bitcoin.png"
  # social share links in post page
